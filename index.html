<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Treinos">
<title>Meus Treinos</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151923; --card2:#1e2430; --card3:#262e3d; --line:#2a3140;
    --txt:#eef1f6; --muted:#8b93a5; --accent:#4f8cff; --accent2:#3b6fe0;
    --ok:#2fd571; --warn:#f5a623; --danger:#ff5d5d;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
    background-image:
      radial-gradient(1200px 500px at 80% -10%, rgba(79,140,255,.10), transparent 60%),
      radial-gradient(900px 420px at -10% 20%, rgba(47,213,113,.05), transparent 60%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 14px 130px;}
  header{
    position:sticky; top:0; z-index:20; background:rgba(11,13,18,.86);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(42,49,64,.6);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  }
  header .wrapinner{max-width:640px; margin:0 auto; width:100%; display:flex; align-items:center; gap:10px;}
  h1{font-size:20px; margin:0; font-weight:800; flex:1; letter-spacing:.2px;}
  .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  button{font-family:inherit; cursor:pointer; border:none; color:var(--txt); background:none; font-size:inherit;}
  .iconbtn{
    width:42px; height:42px; border-radius:13px; background:var(--card2);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 auto;
    transition:transform .1s;
  }
  .iconbtn:active{transform:scale(.92); background:var(--card3);}

  /* ===== Home ===== */
  .hero{margin:18px 2px 6px;}
  .hero .hi{font-size:23px; font-weight:800; letter-spacing:.2px;}
  .hero .date{font-size:13px; color:var(--muted); margin-top:3px; text-transform:capitalize;}
  .grid{display:flex; flex-direction:column; gap:13px; margin-top:16px;}
  .treino-card{
    position:relative; overflow:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    transition:transform .12s;
  }
  .treino-card:active{transform:scale(.98);}
  .treino-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--grad,linear-gradient(180deg,#4f8cff,#3b6fe0));
  }
  .badge{
    width:54px; height:54px; border-radius:16px; flex:0 0 auto;
    background:var(--grad,linear-gradient(135deg,#4f8cff,#3b6fe0));
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:23px; color:#fff;
    box-shadow:0 6px 18px -6px rgba(0,0,0,.55);
  }
  .treino-card .info{flex:1; min-width:0;}
  .treino-card .nome{font-weight:800; font-size:16.5px; letter-spacing:.2px;}
  .treino-card .meta{font-size:12.5px; color:var(--muted); margin-top:4px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pill{background:var(--card2); border:1px solid var(--line); border-radius:99px;
    padding:3px 9px; font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap;}
  .pill.hl{color:var(--ok); border-color:rgba(47,213,113,.35);}
  .pill.go{color:#ffcf5e; border-color:rgba(255,207,94,.45); background:rgba(255,207,94,.10);}
  .chev{color:var(--muted); font-size:24px; flex:0 0 auto;}

  /* ===== Progress header (treino) ===== */
  .prog-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-top:14px; display:flex; align-items:center; gap:14px;
    position:sticky; top:calc(env(safe-area-inset-top) + 68px); z-index:15;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.7);
  }
  .prog-info{flex:1;}
  .prog-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; font-weight:700;}
  .prog-count{font-size:19px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
  .prog-track{height:8px; background:var(--card3); border-radius:6px; overflow:hidden; margin-top:8px;}
  .prog-fill{height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg,var(--accent),var(--ok));
    transition:width .35s cubic-bezier(.2,.8,.2,1);}
  .prog-ring{flex:0 0 auto; position:relative; width:56px; height:56px;}
  .prog-ring svg{transform:rotate(-90deg);}
  .prog-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ===== Exercise card ===== */
  .ex-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px; margin-top:13px; transition:border-color .25s, opacity .25s; position:relative; overflow:hidden;}
  .ex-card.complete{border-color:rgba(47,213,113,.5);}
  .ex-card.complete::after{
    content:"✓ concluído"; position:absolute; top:12px; right:14px;
    font-size:10.5px; font-weight:800; color:var(--ok); text-transform:uppercase; letter-spacing:.6px;
    background:rgba(47,213,113,.12); border:1px solid rgba(47,213,113,.35);
    padding:4px 9px; border-radius:99px;
  }
  .ex-head{display:flex; align-items:flex-start; gap:10px;}
  .ex-num{
    width:30px; height:30px; border-radius:10px; flex:0 0 auto; margin-top:1px;
    background:var(--card3); color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800;
  }
  .ex-card.complete .ex-num{background:rgba(47,213,113,.15); color:var(--ok);}
  .ex-title{flex:1; min-width:0;}
  .ex-name{font-weight:800; font-size:16px; line-height:1.3; padding-right:80px;}
  .ex-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
  .tag{font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:8px;
    background:var(--card3); color:var(--muted); border:1px solid var(--line);}
  .tag.target{color:var(--accent); border-color:rgba(79,140,255,.35); background:rgba(79,140,255,.08);}
  .tag.rest{color:var(--warn); border-color:rgba(245,166,35,.3); background:rgba(245,166,35,.07);}
  .ex-prev{font-size:12.5px; color:var(--muted); margin-top:8px; display:flex; align-items:center; gap:6px;}
  .ex-prev b{color:var(--txt); font-weight:700;}
  .ex-menu{font-size:19px; color:var(--muted); width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .ex-menu:active{background:var(--card2);}

  .sets{margin-top:13px; display:flex; flex-direction:column; gap:9px;}
  .set-row{display:flex; align-items:stretch; gap:8px; border-radius:14px; transition:.15s;}
  .set-row.done-row .fieldwrap input{border-color:rgba(47,213,113,.4); background:rgba(47,213,113,.06);}
  .set-n{width:30px; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; font-weight:800; flex:0 0 auto;}
  .set-row.done-row .set-n{color:var(--ok);}
  .fieldwrap{flex:1; position:relative;}
  .fieldwrap label{position:absolute; top:6px; left:0; right:0; text-align:center;
    font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px;
    pointer-events:none; font-weight:700;}
  .set-row input[type=number]{
    width:100%; height:100%; min-height:54px;
    background:var(--card2); border:1.5px solid var(--line); color:var(--txt);
    border-radius:13px; padding:20px 6px 6px; font-size:17px; font-weight:700; text-align:center;
    -moz-appearance:textfield; transition:border-color .15s;
  }
  .set-row input::-webkit-outer-spin-button,.set-row input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .set-row input:focus{outline:none; border-color:var(--accent);}
  .set-row input::placeholder{color:#525b6d; font-weight:600;}
  .check{width:54px; min-height:54px; border-radius:13px; flex:0 0 auto; background:var(--card2);
    border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#525b6d; transition:.15s;}
  .check:active{transform:scale(.9);}
  .check.done{background:var(--ok); border-color:var(--ok); color:#052b14;
    box-shadow:0 4px 16px -4px rgba(47,213,113,.5);}

  .ex-actions{display:flex; gap:8px; margin-top:12px;}
  .btn{border-radius:13px; padding:13px 14px; font-weight:800; font-size:14px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:7px; transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-soft{background:var(--card2); border:1px solid var(--line); color:var(--txt); flex:1;}
  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    box-shadow:0 8px 20px -8px rgba(79,140,255,.6);}
  .btn-ghost{background:transparent; border:1.5px dashed var(--line); color:var(--muted); width:100%; padding:15px;}

  .footbar{position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:linear-gradient(180deg,rgba(11,13,18,0),rgba(11,13,18,.97) 35%);
    padding:22px 14px calc(env(safe-area-inset-bottom) + 14px);}
  .footbar .inner{max-width:640px; margin:0 auto; display:flex; gap:10px;}
  .btn-lg{flex:1; padding:17px; font-size:15.5px; border-radius:15px;}

  /* ===== Rest timer (barra compacta flutuante) ===== */
  #restBar{position:fixed; left:10px; right:10px; bottom:96px; z-index:40;
    max-width:620px; margin:0 auto;
    background:linear-gradient(135deg,rgba(26,32,44,.98),rgba(17,21,30,.98));
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 16px 38px -12px rgba(0,0,0,.7);
    padding:10px 12px 9px;
    transform:translateY(16px); opacity:0; pointer-events:none; transition:.22s;}
  #restBar.show{transform:translateY(0); opacity:1; pointer-events:auto;}
  #restBar.done{border-color:var(--ok); box-shadow:0 16px 38px -12px rgba(47,213,113,.5);}
  .rb-top{display:flex; align-items:center; gap:10px;}
  .rb-info{display:flex; flex-direction:column; min-width:0; flex:1;}
  .rb-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:800;}
  .rb-ex{font-size:12.5px; color:var(--txt); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rb-time{font-size:30px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:.5px; padding:0 2px;}
  #restBar.done .rb-time{color:var(--ok);}
  .rb-actions{display:flex; gap:6px; align-items:center;}
  .rb-adj{padding:9px 10px; border-radius:11px; background:var(--card2);
    border:1px solid var(--line); font-weight:800; font-size:13px; color:var(--txt);}
  .rb-adj:active{background:var(--card3);}
  .rb-skip{width:38px; height:38px; border-radius:11px; background:var(--card2);
    border:1px solid var(--line); font-size:15px; font-weight:800; color:var(--muted);}
  .rb-skip:active{transform:scale(.94);}
  .rb-track{height:5px; border-radius:99px; background:var(--card3); margin-top:9px; overflow:hidden;}
  .rb-fill{height:100%; border-radius:99px; width:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s linear;}
  #restBar.done .rb-fill{background:var(--ok);}
  .rb-presets{display:flex; gap:6px; margin-top:9px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:1px;}
  .rb-presets::-webkit-scrollbar{display:none;}
  .rpreset{flex:0 0 auto; padding:7px 12px; border-radius:99px; background:var(--card2);
    border:1px solid var(--line); font-size:12px; font-weight:700; color:var(--muted);}
  .rpreset.on{background:rgba(79,140,255,.15); border-color:var(--accent); color:var(--accent);}

  /* ===== Sheet / Modal ===== */
  .backdrop{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); opacity:0;
    pointer-events:none; transition:.2s; backdrop-filter:blur(3px);}
  .backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:55; background:var(--card);
    border-radius:24px 24px 0 0; border-top:1px solid var(--line);
    padding:16px 18px calc(env(safe-area-inset-bottom) + 20px); transform:translateY(120%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); max-width:640px; margin:0 auto;
    max-height:85vh; overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet h2{margin:6px 0 4px; font-size:19px; font-weight:800;}
  .sheet p{margin:0 0 16px; font-size:13px; color:var(--muted);}
  .grip{width:42px; height:5px; background:var(--line); border-radius:4px; margin:0 auto 12px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:700;}
  .field input, .field textarea{width:100%; background:var(--card2); border:1.5px solid var(--line);
    color:var(--txt); border-radius:13px; padding:14px; font-size:15.5px; font-family:inherit; font-weight:600;}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .chip{padding:10px 16px; border-radius:99px; background:var(--card2); border:1.5px solid var(--line);
    font-size:14px; font-weight:700; color:var(--muted);}
  .chip.on{background:rgba(79,140,255,.15); border-color:var(--accent); color:var(--accent);}
  .menu-item{display:flex; align-items:center; gap:13px; padding:16px 6px; font-size:15px;
    border-bottom:1px solid var(--line); font-weight:600;}
  .menu-item:last-child{border-bottom:none;}
  .menu-item .mi-ic{font-size:20px; width:28px; text-align:center;}
  .menu-item .mi-sub{font-size:12px; color:var(--muted); font-weight:500; margin-top:2px;}
  .menu-item.danger{color:var(--danger);}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:14px;}
  .hidden{display:none !important;}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:#111722; border:1px solid var(--line); color:#fff; padding:12px 20px; border-radius:14px;
    font-size:13.5px; z-index:80; opacity:0; transition:.22s; pointer-events:none; font-weight:700;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.8);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* confetti on finish */
  .confetti{position:fixed; top:-12px; z-index:90; width:9px; height:14px; border-radius:2px;
    pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{
    to{transform:translateY(105vh) rotate(720deg); opacity:.7;}
  }
  @keyframes pop{
    0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.08);} 100%{transform:scale(1); opacity:1;}
  }
  .ex-card, .treino-card{animation:pop .28s ease both;}
</style>
</head>
<body>
<header>
  <div class="wrapinner">
    <button class="iconbtn" id="backBtn" style="display:none" aria-label="Voltar">‹</button>
    <div style="flex:1; min-width:0;">
      <h1 id="pageTitle">Meus Treinos 💪</h1>
      <div class="sub" id="pageSub">Escolha o treino de hoje</div>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">⚙️</button>
  </div>
</header>

<div class="wrap">
  <div id="viewHome"></div>
  <div id="viewTreino" class="hidden"></div>
</div>

<div class="footbar hidden" id="footbar">
  <div class="inner">
    <button class="btn btn-soft btn-lg" id="restNowBtn">⏱ Descanso</button>
    <button class="btn btn-accent btn-lg" id="finishBtn">✓ Concluir treino</button>
  </div>
</div>

<!-- Rest overlay -->
<div id="restBar">
  <div class="rb-top">
    <div class="rb-info">
      <span class="rb-label">Descanso</span>
      <span class="rb-ex" id="restExName"></span>
    </div>
    <div class="rb-time" id="restTime">1:30</div>
    <div class="rb-actions">
      <button class="rb-adj" data-rest="-15">−15</button>
      <button class="rb-adj" data-rest="15">+15</button>
      <button class="rb-skip" id="restSkip" title="Encerrar descanso">✕</button>
    </div>
  </div>
  <div class="rb-track"><div class="rb-fill" id="restFill"></div></div>
  <div class="rb-presets" id="restPresets"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="treinoApp.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
/* --- IDs estaveis por nome: o historico deixa de depender de id aleatorio --- */
const SEED_VER=3;
const APP_VER="3.4 · 24/09/2026";   /* aparece no menu ⚙️ — serve pra saber qual versao esta rodando no aparelho */
const BKKEY="treinoApp.backup.v1";
const JRNKEY="treinoApp.journal.v1";   /* caderninho a parte: toda sessao concluida fica registrada aqui tambem */
const slugify=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const sid=(...p)=>"x-"+p.map(slugify).join("-");
let ID_MAP={};
const PRESETS=[30,45,60,90,120,180];
const GRADS=[
  "linear-gradient(135deg,#4f8cff,#3b6fe0)",
  "linear-gradient(135deg,#a855f7,#7c3aed)",
  "linear-gradient(135deg,#2fd571,#16a34a)",
  "linear-gradient(135deg,#f5a623,#ea580c)",
  "linear-gradient(135deg,#ec4899,#db2777)",
  "linear-gradient(135deg,#06b6d4,#0891b2)"
];
const ICONS=["🏋️","💪","🦵","🍑","🔥","⚡"];

/* ---------- Seed (extraído da planilha) ---------- */
function seed(){
  const mk=(nome,series,reps,peso,obs="",rest=null)=>({id:sid(nome),nome,series,repsAlvo:reps,pesoRef:peso,obs,restSecs:rest});
  return {
    treinos:[
      {id:sid("t","Tronco A"), nome:"Tronco A", letra:"A", exercicios:[
        mk("Supino Halter 30°",3,8,18), mk("Remada Máquina",3,9,57.2),
        mk("Supino Máquina",3,8,30), mk("Puxador c/ Triângulo",3,9,40),
        mk("Voador Pack Deck",3,8,17.5), mk("Elevação Lateral Polia",3,6,3.7),
        mk("Rosca Direta Barra W",3,8,20,"RIR-1"), mk("Tríceps Testa Polia/Barra W",3,8,15),
        mk("Lenhador na Polia",3,15,15,"cada lado · 15-20 reps, sem tranco",45),
        mk("Elevação de Pernas",3,12,0,"peso do corpo",45)
      ]},
      {id:sid("t","Perna A + Core"), nome:"Perna A + Core", letra:"B", exercicios:[
        mk("Leg Press 90°",3,8,160,"RPE-9"), mk("Mesa Flexora",3,8,41),
        mk("Cadeira Extensora",3,8,40), mk("Abdutor",3,8,65),
        mk("Panturrilha",3,6,80,"RIR+1"), mk("Desenvolvimento Máquina",3,6,20),
        mk("Rosca Alt. 45°",3,9,8,"RIR+1"), mk("Tríceps Polia Barra V",3,10,15,"RPE-9/10"),
        mk("Prancha Lateral",3,40,0,"SEGUNDOS por lado",45),
        mk("Abdominal na Polia",3,12,20,"ajoelhado · subir carga",45)
      ]},
      {id:sid("t","Tronco B"), nome:"Tronco B", letra:"C", exercicios:[
        mk("Paralelas (Mergulho)",3,8,0,"tronco inclinado à frente · peito inferior"),
        mk("Pulldown Máquina",3,8,45), mk("Remada Curvada",3,8,30,"cotovelo aberto"),
        mk("Pull Over",3,8,12), mk("Remada Alta Barra",3,6,30,"RIR-1"),
        mk("Face Pull",3,8,12), mk("Crucifixo Inverso",3,15,5,"carga leve · execução > peso"),
        mk("Scott Barra",3,10,25,"RIR+1"), mk("Tríceps Francês Polia",3,6,15)
      ]},
      {id:sid("t","Perna B + Core"), nome:"Perna B + Core", letra:"D", exercicios:[
        mk("Búlgaro",3,10,10,"cada perna · começar leve"), mk("Stiff",3,10,10,"RPE-10"),
        mk("Cadeira Flexora",3,8,42.5), mk("Adutor",3,8,55),
        mk("Panturrilha Sentado",3,12,40,"sóleo"), mk("Rosca Martelo",3,10,10),
        mk("Tríceps Máquina",3,9,27.5,"RIR+1"),
        mk("Pallof Press",3,12,15,"cada lado · não deixar o tronco girar",45),
        mk("Protração Serrátil",3,15,10,"empurrar a escápula · polia ou flexão",45)
      ]}
    ],
    historico:{},
    config:{descansoSegundos:90, github:null},
    removidos:[],
    seedVer:SEED_VER,
    updatedAt:0   /* ZERO de proposito: rotina padrao nunca pode vencer a nuvem num sync */
  };
}
/* ---------- Estado ---------- */
let db=load();
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){
    let o=null;
    try{ o=JSON.parse(raw); }catch(e){ o=null; }
    if(o && typeof o==="object" && o.treinos){
      if(!o.updatedAt) o.updatedAt=1;          /* sem data conhecida: deixa a nuvem mandar, o historico se junta de qualquer jeito */
      let m=o;
      try{ m=migrate(o); }
      catch(e){ m=o; if(!m.historico)m.historico={}; if(!m.config)m.config={descansoSegundos:90}; }   /* migracao quebrou? fica com o que ja tinha, NAO reseta */
      try{ localStorage.setItem(KEY,JSON.stringify(m)); }catch(e){}
      return m;
    }
    /* tem dado gravado mas ilegivel: guarda de lado em vez de apagar por cima */
    try{ localStorage.setItem(KEY+".quarentena", raw); }catch(e){}
  }
  const s=seed();
  try{ s.historico=mergeHist({}, journalHist()); }catch(e){}   /* comeco do zero reaproveita o caderninho, se houver */
  try{ localStorage.setItem(KEY,JSON.stringify(s)); }catch(e){}
  return s;
}

/* ---------- Caderninho: registro a parte de cada sessao concluida ----------
   Vive numa chave so dele. Nada alem do "Concluir treino" escreve aqui, entao
   mesmo que o banco principal se perca, as cargas registradas continuam existindo. */
function journalAdd(entradas){
  try{
    let j=JSON.parse(localStorage.getItem(JRNKEY)||"[]");
    if(!Array.isArray(j)) j=[];
    entradas.forEach(e=>j.push(e));
    while(j.length>400) j.shift();
    localStorage.setItem(JRNKEY, JSON.stringify(j));
  }catch(e){}
}
function journalHist(){
  let j=[]; try{ j=JSON.parse(localStorage.getItem(JRNKEY)||"[]"); }catch(e){ j=[]; }
  const h={};
  (Array.isArray(j)?j:[]).forEach(e=>{
    if(!e||!e.exId||!Array.isArray(e.series)) return;
    (h[e.exId]=h[e.exId]||[]).push({data:e.data, ts:e.ts, series:e.series});
  });
  return h;
}

/* ---------- Uniao de historicos: junta os dois lados, nunca apaga ----------
   Usado no sync e no resgate. Duas sessoes sao "a mesma" se tem a mesma data e
   exatamente as mesmas series. */
function histTs(s){
  if(s && s.ts) return s.ts;
  const m=/^(\d{1,2})\/(\d{1,2})$/.exec(String((s&&s.data)||""));
  if(m){
    const hoje=new Date();
    let d=new Date(hoje.getFullYear(), (+m[2])-1, +m[1]);
    if(d.getTime()-hoje.getTime() > 30*864e5) d=new Date(hoje.getFullYear()-1, (+m[2])-1, +m[1]);
    return d.getTime();
  }
  return 0;
}
function histSig(s){
  return String((s&&s.data)||"")+"|"+(((s&&s.series)||[]).map(x=>String(x.peso)+"x"+String(x.reps)).join(","));
}
function mergeHist(a,b){
  const out={};
  const add=h=>{
    if(!h||typeof h!=="object") return;
    for(const k in h){
      const arr=h[k]; if(!Array.isArray(arr)) continue;
      if(!out[k]) out[k]=[];
      const vistos={}; out[k].forEach(x=>{ vistos[histSig(x)]=1; });
      arr.forEach(x=>{ if(!x||!Array.isArray(x.series)) return; const g=histSig(x); if(!vistos[g]){ vistos[g]=1; out[k].push(x); } });
    }
  };
  add(a); add(b);
  for(const k in out){
    out[k].sort((x,y)=>histTs(x)-histTs(y));
    if(out[k].length>30) out[k]=out[k].slice(-30);
  }
  return out;
}

/* ---------- Protecao de dados: migracao, merge do seed e snapshot ---------- */
function histCount(o){ let n=0; const h=(o&&o.historico)||{}; for(const k in h) n+=(h[k]||[]).length; return n; }
function snapshot(motivo,obj){
  try{ const src=obj||db; localStorage.setItem(BKKEY, JSON.stringify({ts:Date.now(), motivo:motivo||"", db:JSON.parse(JSON.stringify(src))})); }catch(e){}
}
function getSnapshot(){ try{ return JSON.parse(localStorage.getItem(BKKEY)||"null"); }catch(e){ return null; } }

/* Troca ids aleatorios por ids derivados do NOME e leva o historico junto. */
function remapIds(o){
  ID_MAP={};
  const used={}, take=base=>{ let id=base,i=2; while(used[id]){ id=base+"-"+(i++); } used[id]=1; return id; };
  const hist=o.historico||{}, novo={};
  (o.treinos||[]).forEach(t=>{
    const tid=take(sid("t",t.nome));
    if(tid!==t.id){ ID_MAP[t.id]=tid; t.id=tid; }
    (t.exercicios||[]).forEach(ex=>{
      const eid=take(sid(ex.nome));
      if(eid!==ex.id) ID_MAP[ex.id]=eid;
      const antigo=hist[ex.id]||[], ja=novo[eid]||[];
      if(antigo.length||ja.length) novo[eid]=ja.concat(antigo).slice(-30);
      ex.id=eid;
    });
  });
  for(const k in hist){ if(!novo[k] && !ID_MAP[k]) novo[k]=hist[k]; }   /* nao joga fora historico orfao */
  o.historico=novo;
  if(Array.isArray(o.removidos)) o.removidos=o.removidos.map(id=>ID_MAP[id]||id);
  return o;
}

/* Aplica mudancas de rotina SEM apagar nada: so adiciona o que e novo. */
function mergeSeed(o){
  if(o.seedVer===SEED_VER) return o;
  const s=seed(), fora={}; (o.removidos||[]).forEach(id=>fora[id]=1);
  o.treinos=o.treinos||[];
  s.treinos.forEach(st=>{
    const t=o.treinos.find(x=>x.id===st.id);
    if(!t){ if(!fora[st.id]) o.treinos.push(st); return; }
    t.exercicios=t.exercicios||[];
    st.exercicios.forEach((se,i)=>{
      if(fora[se.id]) return;
      if(!t.exercicios.some(x=>x.id===se.id)) t.exercicios.splice(Math.min(i,t.exercicios.length),0,se);
    });
  });
  o.seedVer=SEED_VER;
  return o;
}

/* v3: troca a DIVISAO inteira pela nova, preservando historico e os ajustes do usuario.
   O historico e indexado por id derivado do nome, entao exercicio que continua na rotina
   mantem tudo; exercicio que saiu tem o historico guardado (orfao) e volta se readicionado. */
function restructure(o){
  const s=seed(), ant={};
  (o.treinos||[]).forEach(t=>(t.exercicios||[]).forEach(ex=>{ ant[ex.id]=ex; }));
  const fora={}; (o.removidos||[]).forEach(id=>fora[id]=1);
  s.treinos.forEach(t=>{
    t.exercicios=t.exercicios.filter(ex=>!fora[ex.id]).map(ex=>{
      const a=ant[ex.id];
      if(!a) return ex;
      return {id:ex.id, nome:ex.nome,
        series:(a.series!=null?a.series:ex.series),
        repsAlvo:(a.repsAlvo!=null?a.repsAlvo:ex.repsAlvo),
        pesoRef:(a.pesoRef!=null?a.pesoRef:ex.pesoRef),
        obs:(a.obs||ex.obs), restSecs:(a.restSecs!=null?a.restSecs:ex.restSecs)};
    });
  });
  o.treinos=s.treinos;
  return o;
}

function migrate(o){
  if(!o.historico) o.historico={};
  if(!o.config) o.config={descansoSegundos:90};
  if(!Array.isArray(o.removidos)) o.removidos=[];
  if(o.seedVer!==SEED_VER) snapshot("atualiza\u00e7\u00e3o do app", o);   /* rede de seguranca antes de mexer */
  remapIds(o);
  if((o.seedVer||0)<3) restructure(o);   /* v3: divisao 4 dias (2 tronco + 2 perna+core) */
  mergeSeed(o);
  return o;
}
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); return true; }
  catch(e){ return false; }   /* sem espaco no aparelho: quem chamou decide o que avisar */
}
function save(){ db.updatedAt=Date.now(); const ok=persist(); scheduleCloudPush(); return ok; }

const $=s=>document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }
function fmtNum(n){ if(n===""||n==null||isNaN(n)) return ""; return (Math.round(n*100)/100).toString(); }
function fmtSecs(s){ const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
function letra(t){ return t.letra || t.nome[0].toUpperCase(); }
function grad(i){ return GRADS[i%GRADS.length]; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

let current=null;
let liveSession={};

/* ---------- Sessões em andamento (várias ao mesmo tempo; sobrevivem a navegar/recarregar/2º plano) ---------- */
const LIVEKEY="treinoApp.live.v1";
let liveAll={};      // { [treinoId]: { sets:{[exId]:[{peso,reps,feito}]}, ts } }
let liveLast=null;   // último treino que estava aberto
function loadLiveAll(){
  let L; try{ L=JSON.parse(localStorage.getItem(LIVEKEY)||"null"); }catch(e){ L=null; }
  if(!L){ liveAll={}; liveLast=null; return; }
  if(L.treinoId && L.sets){ liveAll={[L.treinoId]:{sets:L.sets, ts:L.ts||Date.now()}}; liveLast=L.treinoId; } // migra formato antigo (1 treino só)
  else { liveAll=L.sessions||{}; liveLast=L.lastTreinoId||null; }
  if(Object.keys(ID_MAP).length){   /* ids mudaram na migracao: leva a sessao em andamento junto */
    const out={};
    Object.keys(liveAll).forEach(tid=>{
      const s=liveAll[tid]||{}, sets={};
      Object.keys(s.sets||{}).forEach(eid=>{ sets[ID_MAP[eid]||eid]=s.sets[eid]; });
      out[ID_MAP[tid]||tid]={sets, ts:s.ts};
    });
    liveAll=out;
    if(liveLast) liveLast=ID_MAP[liveLast]||liveLast;
  }
  const agora=Date.now();
  Object.keys(liveAll).forEach(id=>{ const s=liveAll[id]; if(!s||!s.sets||(s.ts&&agora-s.ts>12*3600*1000)) delete liveAll[id]; }); // esquece cada treino depois de 12h
  if(liveLast && !liveAll[liveLast]) liveLast=null;
}
function persistLiveAll(){ try{ localStorage.setItem(LIVEKEY, JSON.stringify({sessions:liveAll, lastTreinoId:liveLast})); }catch(e){} }
function saveLive(){
  if(!current){ return; }
  liveAll[current.id]={sets:liveSession, ts:Date.now()};
  liveLast=current.id;
  persistLiveAll();
}
function clearLive(){   // limpa só o treino atual (ao concluir)
  if(current){ delete liveAll[current.id]; if(liveLast===current.id) liveLast=null; }
  persistLiveAll();
}
function hydrateLive(t){   // monta liveSession do que já estava salvo desse treino, ou dos valores padrão
  const saved = liveAll[t.id] && liveAll[t.id].sets;
  liveSession={};
  t.exercicios.forEach(ex=>{
    const sv = saved && saved[ex.id];
    liveSession[ex.id]=(Array.isArray(sv)&&sv.length)
      ? sv.map(s=>({peso:s.peso==null?"":s.peso, reps:s.reps==null?"":s.reps, feito:!!s.feito}))
      : buildSets(ex);
  });
  liveAll[t.id]={sets:liveSession, ts:Date.now()};
  liveLast=t.id;
  persistLiveAll();
}

}

function lastDateOf(t){

function liveDone(t){   // nº de séries já marcadas 'feito' na sessão em andamento desse treino (0 = sem progresso)
  const s = liveAll[t.id] && liveAll[t.id].sets;
  if(!s) return 0;
  let n=0;
  Object.keys(s).forEach(exId=>{ const arr=s[exId]; if(Array.isArray(arr)) arr.forEach(x=>{ if(x&&x.feito) n++; }); });

/* ---------- Treino ---------- */
function lastSession(exId){
  const h=db.historico[exId];
  return (h&&h.length)?h[h.length-1]:null;
}
function buildSets(ex){
  // pré-preenche cada série: 1ª vez usa referência da planilha + reps alvo;
  // depois usa peso/reps do que foi registrado da última vez.
  const ls=lastSession(ex.id);
  const rec=(ls&&ls.series.length)?ls.series:null;
  return Array.from({length:ex.series},(_,i)=>{
    let peso="", reps="";
    if(rec){
      const s=rec[i]||rec[rec.length-1];
      peso=s.peso; reps=s.reps;
    }else{
      if(ex.pesoRef!=null&&ex.pesoRef!=="") peso=ex.pesoRef;
      if(ex.repsAlvo!=null&&ex.repsAlvo!=="") reps=ex.repsAlvo;
    }
    return {peso,reps,feito:false};
  });
}
function prevInfo(ex){
  const ls=lastSession(ex.id);
  if(ls){
    const done=ls.series.filter(s=>s.peso!==""||s.reps!=="");
    if(done.length){
      const parts=done.map(s=>`${fmtNum(s.peso)||"-"}${s.reps?"×"+s.reps:""}`);
      return {html:`🕐 Última vez: <b>${parts.join("&nbsp;&nbsp;")}</b>${ls.data?` <span style="color:var(--muted)">(${ls.data})</span>`:""}`,
        peso:done[done.length-1].peso};
    }
  }
  if(ex.pesoRef!=null&&ex.pesoRef!=="")
    return {html:`📋 Referência da planilha: <b>${fmtNum(ex.pesoRef)}kg</b>`, peso:ex.pesoRef};
  return {html:"", peso:""};
}
function exRest(ex){ return ex.restSecs||db.config.descansoSegundos||90; }
function countSets(){
  let total=0, done=0;
  current.exercicios.forEach(ex=>{
    liveSession[ex.id].forEach(s=>{ total++; if(s.feito) done++; });
  });
  return {total,done};
}

  current.exercicios.forEach((ex,i)=>{

    html+=`<div class="ex-card${allDone?" complete":""}" id="exc-${ex.id}">

            <span class="tag target">🎯 ${ex.series} × ${ex.repsAlvo}</span>
            <span class="tag rest" onclick="editRestQuick('${ex.id}')">⏱ ${fmtSecs(exRest(ex))}${ex.restSecs?"":" ·padrão"}</span>
            ${ex.obs?`<span class="tag">${esc(ex.obs)}</span>`:""}
          </div>
          ${prev.html?`<div class="ex-prev">${prev.html}</div>`:""}
        </div>
        <div class="ex-menu" onclick="exMenu('${ex.id}')">⋮</div>
      </div>

    sets.forEach((s,si)=>{

            oninput="setVal('${ex.id}',${si},'peso',this.value)" onchange="setVal('${ex.id}',${si},'peso',this.value)" placeholder="${prev.peso!==""?fmtNum(prev.peso):"0"}"></div>

function updateProgress(){
  const {total,done}=countSets();
  const pct=total?Math.round(done/total*100):0;
  const C=2*Math.PI*24;
  const f=$("#progFill"), r=$("#progRing"), p=$("#progPct"), d=$("#progDone");
  if(f)f.style.width=pct+"%";
  if(r)r.style.strokeDashoffset=C*(1-pct/100);
  if(p)p.textContent=pct+"%";
  if(d)d.textContent=done;
}

/* ---------- Ações de série ---------- */
function setVal(exId,si,campo,val){
  const v=val===""?"":parseFloat(String(val).replace(",","."));
  liveSession[exId][si][campo]=(campo==="reps"&&v!=="")?Math.round(v):v;
  saveLive();
}
function toggleDone(exId,si,el){
  const s=liveSession[exId][si];
  s.feito=!s.feito;
  el.classList.toggle("done",s.feito);
  const row=$("#row-"+exId+"-"+si);
  if(row)row.classList.toggle("done-row",s.feito);
  const card=$("#exc-"+exId);
  const all=liveSession[exId].every(x=>x.feito);
  if(card)card.classList.toggle("complete",all);
  updateProgress();
  saveLive();
  if(s.feito&&navigator.vibrate)navigator.vibrate(30); // só um toque de confirmação; descanso é manual (botão ⏱)
}
/* O número de séries que aparece ao abrir o treino vem de ex.series (a rotina).
   Então + / − Série precisam gravar lá também — senão a mudança vale só pro dia
   e na semana seguinte o exercício volta com a quantidade antiga. */
function syncSeries(exId){
  const ex=current&&current.exercicios.find(e=>e.id===exId);
  const n=(liveSession[exId]||[]).length;
  if(!ex||!n||ex.series===n) return;
  ex.series=n; save();
  toast(n===1?"Agora é 1 série — fica salvo":("Agora são "+n+" séries — fica salvo"));
}
function addSet(exId){
  const arr=liveSession[exId];
  const prev=arr[arr.length-1]||{peso:"",reps:""};
  arr.push({peso:prev.peso,reps:prev.reps,feito:false}); // nova série já com a mesma carga
  syncSeries(exId); saveLive(); renderTreino();
}
function removeSet(exId){
  const arr=liveSession[exId];
  if(arr.length<=1){ toast("Precisa de ao menos 1 série"); return; }
  arr.pop(); syncSeries(exId); saveLive(); renderTreino(); updateProgress();
}

/* ---------- Concluir ---------- */
function finishTreino(){
  const agora=new Date();
  const dataStr=agora.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  let algum=false; const jrn=[];
  current.exercicios.forEach(ex=>{
    const sets=liveSession[ex.id]||[];
    const pre=sets.filter(s=>s.peso!==""||s.reps!==""||s.feito);
    if(pre.length){
      algum=true;
      const series=pre.map(s=>({peso:s.peso,reps:s.reps,feito:s.feito}));
      if(!db.historico[ex.id]) db.historico[ex.id]=[];
      db.historico[ex.id].push({data:dataStr, ts:agora.getTime(), series});
      if(db.historico[ex.id].length>30) db.historico[ex.id].shift();
      jrn.push({exId:ex.id, nome:ex.nome, data:dataStr, ts:agora.getTime(), series});
    }
  });
  if(!algum){ toast("Nada registrado ainda"); return; }
  journalAdd(jrn);            /* 1o no caderninho (chave propria), depois no banco */
  const ok=save();
  if(!ok){ toast("⚠️ Não consegui salvar — sem espaço no aparelho"); return; }   /* mantem a sessao aberta pra nao perder nada */
  clearTimeout(cloudTimer); cloudTimer=null; cloudPush();   /* nuvem AGORA, sem esperar 1,5s (o app pode ser fechado antes) */
  clearLive(); confetti(); toast("Treino salvo! 💪🔥");
  setTimeout(goHome,600);
}
function confetti(){
  const colors=["#4f8cff","#2fd571","#f5a623","#ec4899","#a855f7","#06b6d4"];
  for(let i=0;i<46;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.4+Math.random()*1.4)+"s";
    c.style.animationDelay=(Math.random()*0.4)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}

/* ---------- Cronômetro (relógio real: continua em 2º plano e sobrevive a recarregar) ---------- */
const REST_KEY="treinoApp.rest.v1";
let restT=null, restLeft=0, restTotal=0, restEndsAt=0;
function saveRestState(){
  try{ localStorage.setItem(REST_KEY, JSON.stringify({endsAt:restEndsAt, total:restTotal, ex:$("#restExName").textContent||""})); }catch(e){}
}
function clearRestState(){ try{ localStorage.removeItem(REST_KEY); }catch(e){} }
function restTick(){
  restLeft=Math.max(0,Math.round((restEndsAt-Date.now())/1000));
  updateRest();
  if(restLeft<=0) endRest();
}
function startRest(secs,exName){
  restTotal=secs||db.config.descansoSegundos||90;
  restEndsAt=Date.now()+restTotal*1000;
  $("#restExName").textContent=exName||"";
  renderPresets();
  const bar=$("#restBar"); bar.classList.remove("done"); bar.classList.add("show");
  saveRestState();
  clearInterval(restT); restTick(); restT=setInterval(restTick,250);
}
function renderPresets(){
  $("#restPresets").innerHTML=PRESETS.map(p=>
    `<button class="rpreset${p===restTotal?" on":""}" onclick="setRestTotal(${p})">${fmtSecs(p)}</button>`).join("");
}
function setRestTotal(p){
  restTotal=p; restEndsAt=Date.now()+p*1000;
  $("#restBar").classList.remove("done");
  renderPresets(); saveRestState(); restTick();
}
function updateRest(){
  $("#restTime").textContent=fmtSecs(Math.max(0,restLeft));
  const frac=restTotal?Math.max(0,Math.min(1,restLeft/restTotal)):0;
  const fill=$("#restFill"); if(fill)fill.style.width=(frac*100)+"%";
}
function endRest(){
  clearInterval(restT); restT=null; clearRestState();
  beep(); if(navigator.vibrate)navigator.vibrate([220,90,220]);
  $("#restTime").textContent="0:00";
  const fill=$("#restFill"); if(fill)fill.style.width="0%";
  $("#restBar").classList.add("done");
  setTimeout(hideRest,1400);
}
function hideRest(){
  clearInterval(restT); restT=null; clearRestState();
  const b=$("#restBar"); if(b){ b.classList.remove("show"); b.classList.remove("done"); }
}
function restoreRest(){
  let R; try{ R=JSON.parse(localStorage.getItem(REST_KEY)||"null"); }catch(e){ return; }
  if(!R||!R.endsAt){ return; }
  if(Math.round((R.endsAt-Date.now())/1000)<=0){ clearRestState(); return; } // já acabou enquanto estava fora
  restTotal=R.total||db.config.descansoSegundos||90;
  restEndsAt=R.endsAt;
  $("#restExName").textContent=R.ex||"";
  renderPresets();
  const bar=$("#restBar"); bar.classList.remove("done"); bar.classList.add("show");
  clearInterval(restT); restTick(); restT=setInterval(restTick,250);
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.4,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.14);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.16);
    });
  }catch(e){}
}

/* Forca o app a pegar a versao mais nova. Com sinal, limpa o cache offline e recarrega;

async function buscarAtualizacao(){
  toast("Procurando atualização…");
  try{
    if("serviceWorker" in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.update().catch(()=>{})));
    }
    if(navigator.onLine && window.caches){
      const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(e){}
  setTimeout(()=>location.reload(), 800);
}

/* ---------- Nuvem (GitHub) ---------- */
function gh(){ return (db.config&&db.config.github)||null; }
function ghConfigured(){ const g=gh(); return !!(g&&g.user&&g.repo&&g.token); }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g,"")))); }
function ghUrl(){ const g=gh(); return `https://api.github.com/repos/${g.user}/${g.repo}/contents/${g.path||"dados.json"}`; }
function ghHeaders(){ const g=gh(); return {"Authorization":"Bearer "+g.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; }

let cloudBusy=false, cloudTimer=null;
function scheduleCloudPush(){
  if(!ghConfigured()) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudPush,1500);
}
async function cloudPull(silent){
  if(!ghConfigured()) return;
  try{
    const res=await fetch(ghUrl(),{headers:ghHeaders(),cache:"no-store"});
    if(res.status===404){ await cloudPush(); if(!silent)toast("Nuvem criada ☁️"); return; }
    if(res.status===401||res.status===403){ if(!silent)toast("Token sem acesso ⚠️"); return; }
    if(!res.ok) throw 0;
    const j=await res.json();
    db.config.github.sha=j.sha;
    const remote=JSON.parse(b64decode(j.content));
    const rU=remote.updatedAt||0, lU=db.updatedAt||0;

    /* REGRA DE OURO: o histórico é sempre a UNIÃO dos dois lados.
       Venha a rotina de onde vier, nenhuma sessão registrada some. */
    const juntos=mergeHist(db.historico, remote.historico);
    const nJ=histCount({historico:juntos});
    const ganhouAqui=nJ>histCount(db);
    const temMaisQueNuvem=nJ>histCount(remote);

    if(rU>lU && !current){
      snapshot("baixar da nuvem");
      remote.config=remote.config||{};
      remote.config.github=db.config.github;   // mantém credenciais deste aparelho
      const novo=migrate(remote);
      novo.historico=juntos;                   // rotina da nuvem + histórico dos dois
      db=novo;
      if(temMaisQueNuvem) db.updatedAt=Date.now();
      persist(); renderHome();
      if(temMaisQueNuvem) await cloudPush(true);
      if(!silent)toast("Sincronizado ☁️↓");
    }else{
      if(ganhouAqui){ db.historico=juntos; db.updatedAt=Date.now(); persist(); if(current)renderTreino(); else renderHome(); }
      if(rU>lU && current){
        if(!silent)toast("Treino em andamento — sincroniza ao concluir");
      }else if(lU>rU || temMaisQueNuvem){
        await cloudPush(); if(!silent)toast("Enviado pra nuvem ☁️↑");
      }else if(!silent){
        toast("Já sincronizado ✓");
      }
    }
  }catch(e){ if(!silent)toast("Sem conexão com a nuvem"); }
}
/* force=true pula a junção (usado quando o histórico JÁ foi juntado, ou num apagar-tudo proposital) */
async function cloudPush(force){
  if(!ghConfigured()||cloudBusy) return;
  cloudBusy=true;
  try{
    const g=db.config.github;
    /* TRAVA: antes de gravar, lê o que está na nuvem e junta o histórico.
       Assim nenhum aparelho consegue apagar as cargas do outro por descuido. */
    if(!force){
      try{
        const chk=await fetch(ghUrl()+"?t="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
        if(chk.ok){
          const cj=await chk.json();
          g.sha=cj.sha;
          const rem=JSON.parse(b64decode(cj.content));
          const m=mergeHist(db.historico, rem&&rem.historico);
          if(histCount({historico:m})>histCount(db)){ db.historico=m; db.updatedAt=Date.now(); persist(); }
        }else if(chk.status===404){ g.sha=null; }
      }catch(e){}
    }
    const payload=Object.assign({},db);
    payload.config=Object.assign({},db.config); payload.config.github=undefined; // nunca grava o token no arquivo
    const body={message:"treino "+new Date().toISOString(),content:b64encode(JSON.stringify(payload))};
    if(g.sha) body.sha=g.sha;
    let res=await fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
    if(res.status===409){
      const g2=await fetch(ghUrl(),{headers:ghHeaders(),cache:"no-store"});
      if(g2.ok){ const jj=await g2.json(); body.sha=jj.sha; res=await fetch(ghUrl(),{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)}); }
    }
    if(res.ok){ const j=await res.json(); if(j&&j.content) db.config.github.sha=j.content.sha; }
  }catch(e){}
  cloudBusy=false;
}
function nuvemSheet(){
  const g=gh()||{};
  const st=ghConfigured()?`<span style="color:var(--ok)">● conectado</span>`:`<span style="color:var(--muted)">não configurado</span>`;
  openSheet(`<h2>Nuvem (GitHub) ☁️</h2><p>Guarda seus treinos num repositório <b>privado</b> seu, pra sincronizar entre celular e PC. Status: ${st}</p>
    <div class="field"><label>Usuário do GitHub</label><input id="ghUser" value="${escAttr(g.user||"")}" placeholder="seu-usuario" autocapitalize="none" autocomplete="off"></div>
    <div class="field"><label>Repositório privado (só dos dados)</label><input id="ghRepo" value="${escAttr(g.repo||"")}" placeholder="treino-dados" autocapitalize="none" autocomplete="off"></div>
    <div class="field"><label>Token (fine-grained · Contents: Read and write)</label><input id="ghToken" type="password" value="${escAttr(g.token||"")}" placeholder="github_pat_..." autocapitalize="none" autocomplete="off"></div>
    <div class="ex-actions" style="margin-bottom:10px">
      <button class="btn btn-soft" onclick="closeSheet()">Fechar</button>
      <button class="btn btn-accent" onclick="salvarNuvem()">Salvar e conectar</button>
    </div>
    ${ghConfigured()?`<button class="btn btn-soft" style="width:100%" onclick="closeSheet();cloudPull(false)">🔄 Sincronizar agora</button>
    <button class="btn btn-soft" style="width:100%;margin-top:8px;color:var(--danger)" onclick="desconectarNuvem()">Desconectar este aparelho</button>`:""}`);
}
function salvarNuvem(){
  const user=$("#ghUser").value.trim(), repo=$("#ghRepo").value.trim(), token=$("#ghToken").value.trim();
  if(!user||!repo||!token){ toast("Preencha os 3 campos"); return; }
  db.config.github={user,repo,token,path:"dados.json",sha:(gh()&&gh().sha)||null};
  persist(); closeSheet(); toast("Conectando…"); cloudPull(false);
}
function desconectarNuvem(){ db.config.github=null; persist(); closeSheet(); toast("Nuvem desconectada"); }

/* ---------- Editar treino / exercícios ---------- */
function novoTreino(){
  openSheet(`<h2>Novo treino</h2><p>Ex.: Peito + Tríceps</p>
    <div class="field"><label>Nome do treino</label><input id="ntNome" placeholder="Nome"></div>
    <div class="field"><label>Letra/atalho (opcional)</label><input id="ntLetra" maxlength="2" placeholder="A"></div>
    <div class="ex-actions"><button class="btn btn-soft" onclick="closeSheet()">Cancelar</button>
      <button class="btn btn-accent" onclick="doNovoTreino()">Criar</button></div>`);
}
function doNovoTreino(){
  const nome=$("#ntNome").value.trim(); if(!nome){toast("Digite um nome");return;}
  const l=$("#ntLetra").value.trim();
  const t={id:uid(),nome,letra:l||nome[0].toUpperCase(),exercicios:[]};
  db.treinos.push(t); save(); closeSheet(); openTreino(t.id);
}
function editarTreino(id){
  const t=db.treinos.find(x=>x.id===id);
  openSheet(`<h2>Editar treino</h2>
    <div class="field"><label>Nome</label><input id="etNome" value="${escAttr(t.nome)}"></div>
    <div class="field"><label>Letra/atalho</label><input id="etLetra" maxlength="2" value="${escAttr(letra(t))}"></div>
    <div class="ex-actions"><button class="btn btn-soft" style="background:var(--danger);color:#fff;border:none" onclick="excluirTreino('${id}')">Excluir treino</button>
      <button class="btn btn-accent" onclick="doEditarTreino('${id}')">Salvar</button></div>`);
}
function doEditarTreino(id){
  const t=db.treinos.find(x=>x.id===id);
  t.nome=$("#etNome").value.trim()||t.nome; t.letra=$("#etLetra").value.trim()||t.letra;
  save(); closeSheet();
  $("#pageTitle").textContent=t.nome; $("#pageSub").textContent="Treino "+letra(t);
  toast("Salvo");
}
function excluirTreino(id){
  db.treinos=db.treinos.filter(x=>x.id!==id); save(); closeSheet(); goHome(); toast("Treino excluído");
}
function novoExercicio(){ openSheet(exercicioForm(null)); }
function exMenu(exId){
  const ex=current.exercicios.find(e=>e.id===exId);
  openSheet(`<h2>${esc(ex.nome)}</h2><p>🎯 ${ex.series} × ${ex.repsAlvo} &nbsp;·&nbsp; ⏱ ${fmtSecs(exRest(ex))}</p>
    <div class="menu-item" onclick="closeSheet();editarExercicio('${exId}')"><span class="mi-ic">✏️</span> Editar exercício</div>
    <div class="menu-item" onclick="closeSheet();editRestQuick('${exId}')"><span class="mi-ic">⏱</span> Tempo de descanso deste exercício</div>
    <div class="menu-item danger" onclick="excluirExercicio('${exId}')"><span class="mi-ic">🗑</span> Excluir exercício</div>`);
}
function exercicioForm(ex){
  return `<h2>${ex?"Editar exercício":"Novo exercício"}</h2>
    <div class="field"><label>Nome</label><input id="exNome" value="${ex?escAttr(ex.nome):""}" placeholder="Ex.: Supino Reto"></div>
    <div class="ex-actions" style="margin-bottom:13px">
      <div class="field" style="flex:1;margin:0"><label>Séries</label><input id="exSeries" type="number" inputmode="numeric" value="${ex?ex.series:3}"></div>
      <div class="field" style="flex:1;margin:0"><label>Reps alvo</label><input id="exReps" type="number" inputmode="numeric" value="${ex?ex.repsAlvo:8}"></div>
      <div class="field" style="flex:1;margin:0"><label>Descanso (s)</label><input id="exRest" type="number" inputmode="numeric" value="${ex&&ex.restSecs?ex.restSecs:""}" placeholder="${db.config.descansoSegundos}"></div>
    </div>
    <div class="field"><label>Obs (RPE/RIR, opcional)</label><input id="exObs" value="${ex?escAttr(ex.obs||""):""}" placeholder="Ex.: RIR-1"></div>
    <div class="ex-actions"><button class="btn btn-soft" onclick="closeSheet()">Cancelar</button>
      <button class="btn btn-accent" onclick="doSalvarExercicio('${ex?ex.id:""}')">Salvar</button></div>`;
}
function editarExercicio(exId){
  const ex=current.exercicios.find(e=>e.id===exId);
  openSheet(exercicioForm(ex));
}
function doSalvarExercicio(exId){
  const nome=$("#exNome").value.trim(); if(!nome){toast("Digite o nome");return;}
  const series=Math.max(1,parseInt($("#exSeries").value,10)||3);
  const reps=parseInt($("#exReps").value,10)||8;
  const restRaw=$("#exRest").value;
  const restV=parseInt(restRaw,10);
  const restSecs=(restRaw!==""&&restV>0)?restV:null;
  const obs=$("#exObs").value.trim();
  if(exId){
    const ex=current.exercicios.find(e=>e.id===exId);
    ex.nome=nome; ex.series=series; ex.repsAlvo=reps; ex.obs=obs; ex.restSecs=restSecs;
    const cur=liveSession[exId];
    while(cur.length<series) cur.push({peso:"",reps:"",feito:false});
    while(cur.length>series) cur.pop();   /* diminuir também vale na hora, não só no próximo treino */
  }else{
    const ex={id:uid(),nome,series,repsAlvo:reps,obs,pesoRef:"",restSecs};
    current.exercicios.push(ex);
    liveSession[ex.id]=Array.from({length:series},()=>({peso:"",reps:"",feito:false}));
  }
  save(); saveLive(); closeSheet(); renderTreino();
}
function excluirExercicio(exId){
  current.exercicios=current.exercicios.filter(e=>e.id!==exId);
  db.removidos=db.removidos||[]; if(db.removidos.indexOf(exId)<0) db.removidos.push(exId);
  delete liveSession[exId];
  save(); saveLive(); closeSheet(); renderTreino(); toast("Exercício excluído");
}

/* ---------- Eventos ---------- */
$("#backBtn").onclick=goHome;
$("#menuBtn").onclick=mainMenu;
$("#finishBtn").onclick=finishTreino;
$("#restNowBtn").onclick=()=>startRest(db.config.descansoSegundos,"");
$("#restSkip").onclick=hideRest;
$("#backdrop").onclick=closeSheet;
document.querySelectorAll("#restBar [data-rest]").forEach(b=>{
  b.onclick=()=>{
    const d=parseInt(b.dataset.rest,10)*1000;
    restEndsAt=Math.max(Date.now()+1000, restEndsAt+d);   // nunca deixa negativo
    const left=Math.round((restEndsAt-Date.now())/1000);
    if(left>restTotal){ restTotal=left; renderPresets(); }
    $("#restBar").classList.remove("done");
    saveRestState(); restTick();
  };
});
// Ao voltar pro app (ou trocar de aba), recalcula na hora pelo relógio real
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && restT) restTick(); });

/* Saindo do app (iOS pode matar a página a qualquer momento): garante a sessão
   no disco e dispara a nuvem na hora, em vez de esperar o debounce de 1,5s. */
function flushTudo(){
  try{ if(current) saveLive(); }catch(e){}
  try{ if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer=null; cloudPush(); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) flushTudo(); });
window.addEventListener("pagehide", flushTudo);

/* ---------- Start ---------- */
if(!restoreLive()) goHome();   // se havia treino no meio, reabre com tudo que já estava preenchido
restoreRest();                 // se o descanso estava rodando, retoma contando pelo relógio real
if(ghConfigured()) cloudPull(true);

// Cache offline (sw.js = rede primeiro, cache como reserva). Quando um Service Worker
// novo assume o controle, recarrega uma vez para a versao nova aparecer NA HORA —
// menos no meio de um treino, pra nao atrapalhar quem esta registrando serie.
if("serviceWorker" in navigator){
  const tinhaSW=!!navigator.serviceWorker.controller;
  let jaRecarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!tinhaSW||jaRecarregou||current) return;
    jaRecarregou=true; try{ flushTudo(); }catch(e){} location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(r=>{ r.update().catch(()=>{}); }).catch(()=>{});
  });
}
</script>
